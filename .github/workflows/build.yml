name: Build Physics Sandbox Ultimate

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip uninstall -y pygame pygame-ce || exit 0
          pip install -r requirements.txt
          pip install pillow
          python -c "import pygame; assert getattr(pygame, 'IS_CE', False), 'pygame-ce is required'; print('pygame-ce', pygame.version.ver)"

      - name: Generate application icon
        run: python tools/generate_icon.py

      - name: Build Windows executable
        run: |
          python -m PyInstaller --clean --onefile --noconsole --name PhysicsSandbox --icon assets/app_icon.ico --collect-all pygame --collect-all pygame_gui --collect-all pymunk --collect-all imageio --hidden-import imageio_ffmpeg main.py

      - name: Smoke test packaged executable imports
        shell: pwsh
        run: |
          if (!(Test-Path "dist/PhysicsSandbox.exe")) { throw "PhysicsSandbox.exe not found" }

      - name: Create release package
        shell: pwsh
        run: |
          $package = "dist/PhysicsSandbox-Package.zip"
          if (Test-Path $package) { Remove-Item $package -Force }
          Compress-Archive -Path "dist/PhysicsSandbox.exe","assets" -DestinationPath $package -Force

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PhysicsSandbox-Ultimate-Windows
          path: |
            dist/PhysicsSandbox.exe
            dist/PhysicsSandbox-Package.zip
            assets/app_icon.ico
          if-no-files-found: error
          retention-days: 30

      - name: Publish rolling latest release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -f latest "${{ github.sha }}"
          git push origin refs/tags/latest --force

          gh release view latest *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload latest "dist/PhysicsSandbox.exe" "dist/PhysicsSandbox-Package.zip" --clobber
            gh release edit latest --title "Physics Sandbox Ultimate - Latest" --prerelease
          }
          else {
            gh release create latest "dist/PhysicsSandbox.exe" "dist/PhysicsSandbox-Package.zip" --title "Physics Sandbox Ultimate - Latest" --notes "Rolling build generated automatically from the main branch." --prerelease
          }
