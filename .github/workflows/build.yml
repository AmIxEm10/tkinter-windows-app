name: Build Physics Sandbox EXE

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Windows executable
        run: |
          python -m PyInstaller --onefile --noconsole --name PhysicsSandbox --collect-all pygame_gui --collect-all pymunk main.py

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhysicsSandbox-Windows
          path: dist/PhysicsSandbox.exe
          if-no-files-found: error
          retention-days: 30
